# Builds the backend image for the AWS server and pushes it to GitHub's container registry.
# Every push to main is built (the server deploys the tag of the commit it pulls, see deploy/au-parking-update.sh).
# Follow-up: pin the actions below to commit SHAs instead of major tags.
name: backend-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # the Dockerfile only runs bootJar, so the tests run here first (Testcontainers needs Docker: present on this runner)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Test
        working-directory: parking-app
        run: chmod +x gradlew && ./gradlew test --no-daemon

  push:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: parking-app
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/nunogoncalves06/au-parking-backend:latest
            ghcr.io/nunogoncalves06/au-parking-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
