# Production stack for the AWS server (docs/deploy-aws.md). Run on the server with:
#   docker compose -f docker-compose.prod.yml up -d
# Secrets come from .env next to this file (copy .env.example; .env is never committed).
# parking-app:prod is built on a laptop and copied over: the Gradle build needs more memory
# than the t3.micro has. Only Caddy (80/443) and Mosquitto (8883, TLS) are reachable from outside;
# the database and the raw server port stay on the internal network.
services:
  parking-app:
    image: parking-app:prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/parking-db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      MQTT_USERNAME: ${MQTT_USERNAME:?set MQTT_USERNAME in .env}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}
      # the 1 GB of RAM is shared with Postgres, Mosquitto and Caddy
      JAVA_TOOL_OPTIONS: -Xmx256m -Xms128m

  db:
    image: postgres:16
    restart: unless-stopped
    command: postgres -c shared_buffers=64MB
    environment:
      POSTGRES_DB: parking-db
      POSTGRES_USER: postgres
      # only read when the volume is empty (first start); changing it later doesn't change the DB
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parking-db"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data # survives restarts and `down`; only `down -v` deletes it
      - ./db/init:/docker-entrypoint-initdb.d:ro

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    command: mosquitto -c /mosquitto/config/mosquitto.prod.conf
    ports:
      - "8883:8883" # TLS for sensors; plain 1883 stays inside the Docker network for the backend
    volumes:
      - ./mqtt/config:/mosquitto/config:ro
      - /etc/au-parking/mqtt-certs:/mosquitto/certs:ro # filled by deploy/sync-mqtt-cert.sh
      - mqttdata:/mosquitto/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - parking-app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data # the HTTPS certificate: keep it, or Let's Encrypt rate-limits re-issues
      - caddyconfig:/config

volumes:
  pgdata:
  mqttdata:
  caddydata:
  caddyconfig:
