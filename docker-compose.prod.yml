# Production stack for the AWS server (docs/deploy-aws.md). Run on the server with:
#   docker compose -f docker-compose.prod.yml up -d
# Secrets come from .env next to this file (copy .env.example; .env is never committed).
# The backend image is built by GitHub Actions (.github/workflows/backend-image.yml) and pushed to ghcr.io, tagged with
# the commit sha: the Gradle build needs more memory than the t3.micro has. The update script pulls the new sha tag and
# tags it au-parking-backend:current, which is what runs here, so a plain `up -d` keeps the deployed version.
# PARKING_APP_IMAGE pins another image (the update script does this to roll back). Only Caddy (80/443) and Mosquitto (8883, TLS)
# are reachable from outside;
# the database and the raw server port stay on the internal network.
# fixed, so the volume names (au-parking_pgdata, ...) stay the same whatever the folder is called
name: au-parking

services:
  parking-app:
    image: ${PARKING_APP_IMAGE:-au-parking-backend:current}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/parking-db
      # the app reads and writes rows as parking_app; only the migrations run as the owner
      SPRING_DATASOURCE_USERNAME: parking_app
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      SPRING_FLYWAY_USER: postgres
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      # admin login; all four empty = the admin API refuses everything. ADMIN_AUTH is never passed here
      COGNITO_REGION: ${COGNITO_REGION:-}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      COGNITO_DOMAIN: ${COGNITO_DOMAIN:-}
      MQTT_USERNAME: ${MQTT_USERNAME:?set MQTT_USERNAME in .env}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-} # optional, see .env.example
      # the 1 GB of RAM is shared with Postgres, Mosquitto and Caddy
      JAVA_TOOL_OPTIONS: -Xmx256m -Xms128m
      ADMIN_UPDATE_DIR: /update
    volumes:
      # one-click update (deploy/au-parking-update.sh): status files read-only, and only the inbox folder writable,
      # where the backend creates its request file. The backend has no Docker access and cannot change anything else
      - /var/lib/au-parking-update:/update:ro
      - /var/lib/au-parking-update/inbox:/update/inbox

  db:
    image: postgres:16
    restart: unless-stopped
    command: postgres -c shared_buffers=64MB
    environment:
      POSTGRES_DB: parking-db
      POSTGRES_USER: postgres
      # only read when the volume is empty (first start); changing it later doesn't change the DB
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parking-db"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data # survives restarts and `down`; only `down -v` deletes it
      - ./db/init:/docker-entrypoint-initdb.d:ro

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    command: mosquitto -c /mosquitto/config/mosquitto.prod.conf
    ports:
      - "8883:8883" # TLS for sensors; plain 1883 stays inside the Docker network for the backend
    volumes:
      - ./mqtt/config:/mosquitto/config:ro
      - /etc/au-parking/mqtt-certs:/mosquitto/certs:ro # filled by deploy/sync-mqtt-cert.sh
      - mqttdata:/mosquitto/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - parking-app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      # the Cognito login host, allowed in the dashboard's Content-Security-Policy
      COGNITO_DOMAIN: ${COGNITO_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data # the HTTPS certificate: keep it, or Let's Encrypt rate-limits re-issues
      - caddyconfig:/config

volumes:
  pgdata:
  mqttdata:
  caddydata:
  caddyconfig:
