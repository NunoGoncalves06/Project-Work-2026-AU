spring.application.name=parking-app

spring.datasource.url=jdbc:postgresql://localhost:5432/parking-db
spring.datasource.username=postgres
spring.datasource.password=password
# fail fast when Postgres is down (default 30 s): the MQTT listeners retry a reading for about 15 s in all (1+2+4+8 s)
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=validate
spring.web.error.include-message=always
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# password of the least-privilege login parking_app that db/migration/afterMigrate.sql keeps in place on every
# start; empty = skipped (local dev, tests). Checked by AppDbLogin
spring.flyway.placeholders.app_db_password=${APP_DB_PASSWORD:}
# admin routes reject a body with fields they do not know
spring.jackson.deserialization.fail-on-unknown-properties=true

# graceful shutdown waits on open SSE streams past the 10 s Docker stop timeout, so @PreDestroy would never run
server.shutdown=immediate
