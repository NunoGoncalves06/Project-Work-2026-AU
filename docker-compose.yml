services:
  parking-app:
    image: 'docker-spring-boot-postgres:latest'
    build:
      context: ./parking-app
    container_name: parking-app
    # come back by themselves after a Docker/laptop restart
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
    - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/parking-db
    - SPRING_DATASOURCE_USERNAME=postgres
    - SPRING_DATASOURCE_PASSWORD=password
    - SPRING_JPA_HIBERNATE_DDL_AUTO=validate

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: parking-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password #change and save somewhere else when we work with real data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parking-db"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro #runs at first start
      - ./db/scripts:/scripts:ro #to test select statements

  mosquitto:
    image: eclipse-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt/config:/mosquitto/config #to load config to container
      - ./mqtt/data:/mosquitto/data #file used to store data
      - ./mqtt/log:/mosquitto/log 
