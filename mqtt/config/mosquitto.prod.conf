# Production broker (docker-compose.prod.yml): like mosquitto.conf, but every client must log in.
# Users live in pwfile, created on the server with mosquitto_passwd (docs/deploy-aws.md).
listener 1883

# TLS for sensors; the backend uses 1883 inside the Docker network. Login settings below are global (no per_listener_settings), so they cover both.
listener 8883
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
# Only on 8883: it is the internet-facing port; 1883 is reachable only from inside the Docker network.
max_connections 50

persistence true
persistence_location /mosquitto/data
# Offline clients' queued messages are dropped after a week.
persistent_client_expiration 7d

allow_anonymous false
password_file /mosquitto/config/pwfile
acl_file /mosquitto/config/aclfile

# The backend only needs live readings; a retained message would be replayed to every new subscriber (and survive restarts).
retain_available false

max_packet_size 4096
max_queued_messages 1000
max_queued_bytes 1048576
